services:
  mongodb:
    #TODO: (Biz) needs discussion, or a automatic fix. Should we just use 7.0?
    # we have an existing mongo_data volume created by 6.0, for some service providers.
    # we cannot go 6.0 to 8.0 directly... need to step through 7.0 first.
    #
    # case is not handled yet but we can run mongo:7.0 once, setFeatureCompatibilityVersion "7.0",
    # then move to 8.0. Alternatively, we can drain and recreate the volume
    image: mongo:8.0.26
    container_name: mongodb
    restart: always
    # (cap_drop/read_only are NOT applied here. the entrypoint needs
    # chown/setuid caps at startup and mongod writes to its volume
    security_opt:
      - no-new-privileges:true
    # mongo is only reachable on the internal compose network, ports section unnecessary
    environment:
      # no defaults here. compose should fail loudly if they are unset
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:?set in .env}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?set in .env}
      - MONGO_INITDB_DATABASE=epicbox
      # make app-user password available to mongo-init through
      # process.env so as not to hardcode in the init script either
      - EPICBOX_DB_PASSWORD=${EPICBOX_DB_PASSWORD:?set in .env}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    # wait for mongo to actually accept connections, not just that container exists
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  epicbox1:
    build:
      context: .
      dockerfile: epicbox/Dockerfile
    container_name: epicbox1
    restart: always
    user: "epicsvcs"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # password comes from env instead of old default
      - MONGO_URL=mongodb://epicbox:${EPICBOX_DB_PASSWORD:?set in .env}@mongodb:27017/epicbox?authSource=epicbox
      - EPICBOX_INSTANCE_ID=1
      - EPICBOX_DOMAIN=${EPICBOX_DOMAIN:-epicbox.your-domain.com}
      - EPICBOX_PORT=${EPICBOX_PORT:-443}
    # wait for mongo to be healthy, after start
    # fails with 10s timeout
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8888:3423"

  epicbox2:
    build:
      context: .
      dockerfile: epicbox/Dockerfile
    container_name: epicbox2
    restart: always
    user: "epicsvcs"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - MONGO_URL=mongodb://epicbox:${EPICBOX_DB_PASSWORD:?set in .env}@mongodb:27017/epicbox?authSource=epicbox
      - EPICBOX_INSTANCE_ID=2
      - EPICBOX_DOMAIN=${EPICBOX_DOMAIN:-epicbox.your-domain.com}
      - EPICBOX_PORT=${EPICBOX_PORT:-443}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8889:3423"

  nginx:
    # note: nginx retires each stable branch every april. plan move to
    # the 1.32 series around april 2027
    image: nginx:1.30.3-alpine
    container_name: nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NGINX_PORT:-8443}:443"
    # pass variables to the container
    environment:
      - EPICBOX_DOMAIN=${EPICBOX_DOMAIN:-epicbox.your-domain.com}
      - EPICBOX_PORT=${EPICBOX_PORT:-443}
    # restrict it to exactly the vars in template
    # should extend the list, if more are added
    entrypoint: ["/bin/sh", "-c", "envsubst '$$EPICBOX_DOMAIN $$EPICBOX_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
    depends_on:
      - epicbox1
      - epicbox2

volumes:
  mongo_data:
